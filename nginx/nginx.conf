# Nginx Reverse Proxy Configuration
# Acts as the single entry point for ALL services
# 
# Traffic Flow:
#   Browser → Nginx :80 → correct service
#
# Local:  http://localhost/api/auth/register
# K8s:    http://cluster-ip/api/auth/register


events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log format with request timing
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;

    # Rate Limiting Zones
    # Prevents abuse / DDoS
  
    # Per IP: 30 requests per minute for auth endpoints
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;
    # Per IP: relaxed for local SPA bursts (parallel fetches, StrictMode double-invocations)
    limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=30r/s;
    limit_req_status 429;

  
    # Upstream Service Definitions
    # Add each service here as you build them
  
    upstream auth_service {
        server auth-service:8001;
        keepalive 32;
    }

    upstream patient_service {
        server patient-service:8002;
        keepalive 32;
    }
    # upstream doctor_service {
    #     server doctor-service:8003;
    # doctor-service and ai-symptom-service use variable proxy_pass + resolver (see server block)
    # so nginx can start before those containers are healthy.

    # Uncomment as each service is built:
    # upstream patient_service {
    #     server patient-service:8003;
    #     keepalive 32;
    # }
    # upstream appointment_service {
    #     server appointment-service:8004;
    #     keepalive 32;
    # }
    upstream payment_service {
        server payment-service:8005;
        keepalive 32;
    }
    # file-storage-service uses variable proxy_pass + resolver in location blocks.
    # Keeping this as a static upstream can make nginx fail hard on startup if the
    # container DNS entry is not ready yet.
    # Edge routing goes through api-gateway; keep only required static upstreams.
    upstream api_gateway {
        server api-gateway:8000;
        keepalive 32;
    }
    # upstream notification_service {
    #     server notification-service:8006;
    #     keepalive 32;
    # }
    # upstream admin_service {
    #     server admin-service:8007;
    #     keepalive 32;
    # }
    # upstream frontend {
    #     server frontend:3000;
    #     keepalive 32;
    # }

    server {
        listen 80 default_server;
        server_name localhost;

        # Docker embedded DNS — resolve upstream hostnames at request time so nginx starts
        # even when doctor-service / ai-symptom-service are still restarting.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # Max request body size (for file uploads — adjust for file-storage-service)
        client_max_body_size 50M;

        # Security headers
        add_header X-Frame-Options          "SAMEORIGIN"  always;
        add_header X-Content-Type-Options   "nosniff"     always;
        add_header X-XSS-Protection         "1; mode=block" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

        # Auth Service Routes
        # Rate limited more strictly (login, register)
    
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Authorization     $http_authorization;
            proxy_set_header   Connection        "";

            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
        }

        # Internal validate endpoint — only accessible from other services
        # Block external access to /auth/validate
        location /api/auth/validate {
            # Only allow internal network (Docker/K8s internal IPs)
            allow 172.16.0.0/12;  # Docker default network range
            allow 10.0.0.0/8;     # K8s pod network range
            deny  all;

            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Authorization     $http_authorization;
            proxy_set_header   Connection        "";
        }

        # All API traffic goes through the API Gateway
        location ^~ /api/ {
            limit_req zone=api_limit burst=200 nodelay;

            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Authorization     $http_authorization;
            proxy_set_header   Connection        "";

            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
        }

        # Uncomment as services are built:

  
        # Patient Service Routes
        location /api/v1/patient/ {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Authorization   $http_authorization;
            proxy_set_header   Connection      "";
        }

        location /api/v1/payments/ {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Authorization   $http_authorization;
            proxy_set_header   Connection      "";
        }

        location = /api/v1/files {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Authorization     $http_authorization;
            proxy_set_header   Connection      "";
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location = /api/v1/files/ {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Authorization     $http_authorization;
            proxy_set_header   Connection      "";
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location ^~ /api/v1/files/ {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Authorization     $http_authorization;
            proxy_set_header   Connection      "";
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

     
        # Doctor Service — paths /doctor/ and /api/doctors/ → doctor-service /doctors/

        location = /doctor {
            return 301 /doctor/;
        }

        location /doctor/ {
            limit_req zone=api_limit burst=200 nodelay;
            rewrite ^/doctor/(.*)$ /api/doctors/$1 break;
            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Authorization     $http_authorization;
            proxy_set_header   Connection        "";
            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
        }

        location /api/doctors {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Authorization     $http_authorization;
            proxy_set_header   Connection        "";
            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
        }

        # v1 alias for consistency with other services
        location /api/v1/doctors/ {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Authorization     $http_authorization;
            proxy_set_header   Connection        "";
            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
        }

        # AI Symptom Checker — /api/ai/symptom/check → ai-symptom-service /symptoms/check
        location /api/ai/symptom/ {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Authorization $http_authorization;
            proxy_set_header   Connection        "";
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    
        # Support Service — for reactivation tickets
        location /api/support/ {
            limit_req zone=api_limit burst=50 nodelay;
            set $support_upstream support-service:8011;
            rewrite ^/api/support/(.*)$ /api/support/$1 break;
            proxy_pass         http://$support_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Connection      "";
        }

       
        # Appointment Service Routes
     
        location /api/v1/appointments {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Authorization   $http_authorization;
            proxy_set_header   Connection      "";
        }

        location /api/v1/slots {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Authorization   $http_authorization;
            proxy_set_header   Connection      "";
        }

        # Admin Service Routes
        # Exact matches for current admin UI endpoints to avoid any location fallthrough.
        location = /api/admin/users {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass         http://admin-service:8007/admin/users;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Authorization   $http_authorization;
            proxy_set_header   Connection      "";
        }

        location = /api/admin/appointments {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass         http://admin-service:8007/admin/appointments;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Authorization   $http_authorization;
            proxy_set_header   Connection      "";
        }

        location = /api/admin/transactions {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass         http://admin-service:8007/admin/transactions;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Authorization   $http_authorization;
            proxy_set_header   Connection      "";
        }

        location ^~ /api/admin/ {
            limit_req zone=api_limit burst=20 nodelay;
            set $admin_upstream admin-service:8007;
            rewrite ^/api/admin/(.*)$ /admin/$1 break;
            proxy_pass         http://$admin_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Authorization   $http_authorization;
            proxy_set_header   Connection      "";
        }

  
        # Health Check Aggregation
     
        location /health/auth {
            set $auth_upstream auth-service:8001;
            rewrite ^ /health break;
            proxy_pass http://$auth_upstream;
        }

        location /health/file-storage {
            set $file_storage_upstream file-storage-service:8010;
            rewrite ^ /health break;
            proxy_pass http://$file_storage_upstream;
        }

        location /health/doctor {
            set $doctor_upstream doctor-service:8003;
            rewrite ^ /health break;
            proxy_pass http://$doctor_upstream;
        }

        location /health/ai-symptom {
            set $ai_symptom_upstream ai-symptom-service:8008;
            rewrite ^ /health break;
            proxy_pass http://$ai_symptom_upstream;
        }

        location /health/admin {
            set $admin_upstream admin-service:8007;
            rewrite ^ /health break;
            proxy_pass http://$admin_upstream;
        }

        location /health/notification {
            set $notification_upstream notification-service:8006;
            rewrite ^ /health break;
            proxy_pass http://$notification_upstream;
        }

        location /health/notification/ready {
            set $notification_upstream notification-service:8006;
            rewrite ^ /ready break;
            proxy_pass http://$notification_upstream;
        }

        location /health {
            return 200 '{"status":"nginx-ok"}';
            add_header Content-Type application/json;
        # Health endpoints (gateway-only)
        location /health {
            proxy_pass http://api_gateway/health;
        }

        location = /ready {
            proxy_pass http://api_gateway/ready;
        }

        # React Frontend
        location / {
            set $frontend_upstream frontend:80;
            proxy_pass         http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
        }
    }
}
