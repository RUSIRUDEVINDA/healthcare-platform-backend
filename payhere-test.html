<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayHere Sandbox Test | Medi Pulse</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

        :root {
            --bg: #0f1117;
            --card: #1a1d27;
            --border: #2a2d3a;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --pay: #f97316;
            --pay-hover: #ea6c09;
            --success: #22c55e;
            --error: #ef4444;
            --text: #e2e8f0;
            --muted: #64748b;
            --token-bg: #12151f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            width: 100%;
            max-width: 540px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .header p {
            font-size: 0.8rem;
            color: var(--muted);
            margin-top: 0.3rem;
        }

        .badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.15);
            color: var(--primary);
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 99px;
            border: 1px solid rgba(59, 130, 246, 0.3);
            margin-bottom: 0.75rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .section-title {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            margin-bottom: 0.75rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--muted);
            margin-bottom: 0.4rem;
        }

        input,
        textarea {
            width: 100%;
            padding: 0.65rem 0.85rem;
            background: var(--token-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: 'DM Mono', monospace;
            font-size: 0.78rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus,
        textarea:focus {
            border-color: var(--primary);
        }

        textarea {
            resize: vertical;
            min-height: 70px;
        }

        .token-section {
            background: var(--token-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }

        .divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 1.5rem 0;
        }

        button {
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-step1 {
            background: var(--primary);
            color: white;
            margin-top: 0.5rem;
        }

        .btn-step1:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-step1:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-pay {
            background: var(--pay);
            color: white;
            display: none;
            margin-top: 0.75rem;
            font-size: 1rem;
            padding: 1rem;
        }

        .btn-pay:hover {
            background: var(--pay-hover);
            transform: translateY(-1px);
        }

        .loader {
            display: none;
            text-align: center;
            padding: 1rem;
            color: var(--primary);
            font-size: 0.85rem;
        }

        .loader::before {
            content: '';
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .status {
            display: none;
            margin-top: 1rem;
            padding: 0.85rem 1rem;
            border-radius: 8px;
            font-size: 0.82rem;
            line-height: 1.5;
            word-break: break-all;
        }

        .status.error {
            display: block;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .status.success {
            display: block;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            margin-top: 0.4rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-row span:first-child {
            color: var(--muted);
        }

        .info-row span:last-child {
            font-family: 'DM Mono', monospace;
            color: var(--text);
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="header">
            <div class="badge">Sandbox Mode</div>
            <h1>🏥 Medi Pulse Payment Test</h1>
            <p>PayHere Sandbox Integration Tester</p>
        </div>

        <!-- Step 0: JWT Token -->
        <div class="token-section">
            <p class="section-title">🔑 Step 0 — JWT Token (Postman Login එකෙන් copy කරන්න)</p>
            <div class="form-group" style="margin-bottom:0">
                <label>Bearer Token</label>
                <textarea id="jwt_token" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."></textarea>
            </div>
        </div>

        <!-- Step 1: Payment Details -->
        <p class="section-title">💳 Step 1 — Payment Details</p>

        <div class="form-group">
            <label>Appointment ID (Unique UUID)</label>
            <input type="text" id="appointment_id">
        </div>
        <div class="form-group">
            <label>Patient ID</label>
            <input type="text" id="patient_id" value="9a875e67-4a7e-467d-a858-4896c4cda32e">
        </div>
        <div class="form-group">
            <label>Amount (LKR)</label>
            <input type="number" id="amount" value="1500.00">
        </div>

        <button class="btn-step1" id="init_btn" onclick="startWorkflow()">
            ⚙️ Step 1: Generate Checkout Hash
        </button>

        <div id="loader" class="loader">Securely generating PayHere hash...</div>
        <div id="status" class="status"></div>

        <!-- Checkout Info -->
        <div id="checkout_info" style="display:none; margin-top:1rem;">
            <hr class="divider" style="margin:1rem 0">
            <p class="section-title">✅ Checkout Ready</p>
            <div id="checkout_details"></div>
        </div>

        <!-- Hidden PayHere Form -->
        <form id="payhere_form" method="post">
            <div id="form_fields"></div>
            <button type="submit" class="btn-pay" id="pay_button">
                🚀 Step 2: Pay with PayHere Sandbox
            </button>
        </form>
    </div>

    <script>
        // Auto generate UUID on load
        document.getElementById('appointment_id').value = crypto.randomUUID();

        async function startWorkflow() {
            const token = document.getElementById('jwt_token').value.trim();
            const appointmentId = document.getElementById('appointment_id').value.trim();
            const patientId = document.getElementById('patient_id').value.trim();
            const amount = parseFloat(document.getElementById('amount').value);

            const status = document.getElementById('status');
            const loader = document.getElementById('loader');
            const payButton = document.getElementById('pay_button');
            const form = document.getElementById('payhere_form');
            const fieldsContainer = document.getElementById('form_fields');
            const checkoutInfo = document.getElementById('checkout_info');
            const checkoutDetails = document.getElementById('checkout_details');
            const initBtn = document.getElementById('init_btn');

            // Validate token
            if (!token) {
                status.textContent = "❌ JWT Token නැහැ! Postman Login කරලා token copy කරන්න.";
                status.className = "status error";
                return;
            }

            status.style.display = 'none';
            loader.style.display = 'block';
            payButton.style.display = 'none';
            fieldsContainer.innerHTML = '';
            checkoutInfo.style.display = 'none';
            initBtn.disabled = true;

            const headers = {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            };

            try {
                // A — Create Payment
                const createResp = await fetch('http://localhost:8005/api/v1/payments/', {
                    method: 'POST',
                    headers,
                    body: JSON.stringify({
                        appointment_id: appointmentId,
                        patient_id: patientId,
                        amount: amount,
                        currency: 'LKR'
                    })
                });

                const createData = await createResp.json();

                if (!createResp.ok && createResp.status !== 409) {
                    throw new Error(`Payment create failed: ${createData.error || createResp.status}`);
                }

                // B — Get Checkout Hash
                const checkoutResp = await fetch('http://localhost:8005/api/v1/payments/checkout', {
                    method: 'POST',
                    headers,
                    body: JSON.stringify({
                        appointment_id: appointmentId,
                        items: "Medical Appointment Consultation",
                        customer: {
                            first_name: "John",
                            last_name: "Doe",
                            email: "john.doe@test.com",
                            phone: "0771234567",
                            address: "No 1, Main Rd",
                            city: "Colombo",
                            country: "Sri Lanka"
                        }
                    })
                });

                const checkoutData = await checkoutResp.json();
                if (!checkoutResp.ok) {
                    throw new Error(checkoutData.details || checkoutData.error || 'Checkout failed');
                }

                // C — Setup Hidden Form
                form.action = checkoutData.checkout_url;
                for (const [key, value] of Object.entries(checkoutData.fields)) {
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = key;
                    input.value = value;
                    fieldsContainer.appendChild(input);
                }

                // Show info
                checkoutDetails.innerHTML = `
                <div class="info-row"><span>Payment ID</span><span>${checkoutData.payment_id}</span></div>
                <div class="info-row"><span>Amount</span><span>Rs. ${checkoutData.fields.amount} ${checkoutData.fields.currency}</span></div>
                <div class="info-row"><span>Merchant ID</span><span>${checkoutData.fields.merchant_id}</span></div>
                <div class="info-row"><span>Hash</span><span>${checkoutData.fields.hash.substring(0, 16)}...</span></div>
                <div class="info-row"><span>Notify URL</span><span>${checkoutData.fields.notify_url}</span></div>
            `;
                checkoutInfo.style.display = 'block';

                status.textContent = "✅ Hash generated! දැන් Step 2 button click කරන්න — PayHere page open වෙනවා.";
                status.className = "status success";
                payButton.style.display = 'block';

            } catch (err) {
                status.textContent = "❌ " + err.message;
                status.className = "status error";
            } finally {
                loader.style.display = 'none';
                initBtn.disabled = false;
            }
        }
    </script>

</body>

</html>
