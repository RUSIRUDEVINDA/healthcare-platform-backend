# ─────────────────────────────────────────────────────────────
# Local Development Docker Compose
# Run: docker-compose up --build
# Stop: docker-compose down
# Wipe volumes: docker-compose down -v
# ─────────────────────────────────────────────────────────────

services:

  # ────────────────────────────────
  # Infrastructure Services
  # ────────────────────────────────

  auth-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - healthcare-net

  doctor-db:
    image: postgres:17-alpine
    container_name: doctor-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: doctor_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5439:5432"
    volumes:
      - doctor-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d doctor_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - healthcare-net

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password123
    ports:
      - "5672:5672"     # AMQP protocol — services connect here
      - "15672:15672"   # Management UI — open http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - healthcare-net

  # ────────────────────────────────
  # Application Services
  # ────────────────────────────────

  auth-service:
    build:
      context: .
      dockerfile: ./services/auth-service/Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8001"   # Exposed for direct testing with curl/Postman
    env_file:
      - ./services/auth-service/.env
    environment:
      APP_ENV: development
      PORT: "8001"
      # Set AUTH_DATABASE_URL in repo-root .env to use Neon (sslmode=require). Default stays local auth-db.
      DATABASE_URL: "${AUTH_DATABASE_URL:-postgres://postgres:password123@auth-db:5432/auth_db?sslmode=disable}"
      RABBITMQ_URL: "amqp://admin:password123@rabbitmq:5672/"
      JWT_SECRET: "local-dev-secret-change-this-in-production-32chars"
      JWT_REFRESH_SECRET: "local-dev-refresh-secret-change-in-production-32chars"
      ACCESS_TOKEN_TTL_MINUTES: "15"
      REFRESH_TOKEN_TTL_DAYS: "7"
    depends_on:
      auth-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - healthcare-net

  patient-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: patient_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5434:5432"
    volumes:
      - patient-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d patient_db"]
      interval: 10s
    networks:
      - healthcare-net

  patient-service:
    build:
      context: .
      dockerfile: ./services/patient-service/Dockerfile
    ports:
      - "8002:8002"
    environment:
      APP_ENV: development
      PORT: "8002"
      DATABASE_URL: "postgres://postgres:password123@patient-db:5432/patient_db?sslmode=disable"
      RABBITMQ_URL: "amqp://admin:password123@rabbitmq:5672/"
      JWT_SECRET: "local-dev-secret-change-this-in-production-32chars"
      INTERNAL_API_KEY: "dev-inter-service-appointments-patients"
    depends_on:
      patient-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - healthcare-net
  doctor-service:
    build:
      context: .
      dockerfile: ./services/doctor-service/Dockerfile
    container_name: doctor-service
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      APP_ENV: development
      PORT: "8003"
      # Set DOCTOR_DATABASE_URL in repo-root .env to use Neon (sslmode=require). Default stays local doctor-db.
      DATABASE_URL: "${DOCTOR_DATABASE_URL:-postgres://postgres:password123@doctor-db:5432/doctor_db?sslmode=disable}"
      RABBITMQ_URL: "amqp://admin:password123@rabbitmq:5672/"
      AUTH_SERVICE_URL: "http://auth-service:8001"
    depends_on:
      doctor-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - healthcare-net

  ai-symptom-db:
    image: postgres:17-alpine
    container_name: ai-symptom-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: symptom_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    volumes:
      - ai-symptom-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d symptom_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - healthcare-net

  # LLM keys in repo-root .env. DATABASE_URL defaults to local ai-symptom-db (override for Neon, etc.).
  ai-symptom-service:
    build:
      context: .
      dockerfile: ./services/ai-symptom-service/Dockerfile
    container_name: ai-symptom-service
    restart: unless-stopped
    ports:
      - "8008:8008"
    environment:
      APP_ENV: development
      PORT: "8008"
      AUTH_SERVICE_URL: "http://auth-service:8001"
      DATABASE_URL: "${AI_SYMPTOM_DATABASE_URL:-postgres://postgres:password123@ai-symptom-db:5432/symptom_db?sslmode=disable}"
      AI_PROVIDER: "${AI_PROVIDER:-openai}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "gpt-4o-mini"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-2.5-flash}"
    depends_on:
      ai-symptom-db:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - healthcare-net

  payment-db:
    image: postgres:17-alpine
    container_name: payment-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5437:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_db"]
      interval: 10s
    networks:
      - healthcare-net

  payment-service:
    build:
      context: .
      dockerfile: ./services/payment-service/Dockerfile
    container_name: payment-service
    ports:
      - "8005:8005"
    env_file:
      - ./services/payment-service/.env
    environment:
      APP_ENV: development
      PORT: "8005"
      DATABASE_URL: "postgres://postgres:password123@payment-db:5432/payment_db?sslmode=disable"
      RABBITMQ_URL: "amqp://admin:password123@rabbitmq:5672/"
    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - healthcare-net

  file-storage-db:
    image: postgres:17-alpine
    container_name: file-storage-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: file_storage_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5436:5432"
    volumes:
      - file-storage-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d file_storage_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - healthcare-net

  file-storage-service:
    build:
      context: .
      dockerfile: ./services/file-storage-service/Dockerfile
    container_name: file-storage-service
    restart: unless-stopped
    ports:
      - "8010:8010"
    env_file:
      - ./services/file-storage-service/.env
    environment:
      APP_ENV: development
      PORT: "8010"
      DATABASE_URL: "${FILE_STORAGE_DATABASE_URL:-postgres://postgres:password123@file-storage-db:5432/file_storage_db?sslmode=disable}"
      RABBITMQ_URL: "amqp://admin:password123@rabbitmq:5672/"
      APPOINTMENT_SERVICE_URL: "http://appointment-service:8004"
      JWT_SECRET: "local-dev-secret-change-this-in-production-32chars"
      JWT_REFRESH_SECRET: "local-dev-refresh-secret-change-in-production-32chars"
      MAX_IMAGE_SIZE_BYTES: "10485760"
      MAX_DOCUMENT_SIZE_BYTES: "26214400"
    depends_on:
      file-storage-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      appointment-service:
        condition: service_started
    networks:
      - healthcare-net

  # ────────────────────────────────
  # Reverse Proxy
  # ────────────────────────────────

  # ────────────────────────────────
  # Appointment Service & DB
  # ────────────────────────────────

  appointment-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: appointment_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"
    volumes:
      - appointment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d appointment_db"]
      interval: 10s
    networks:
      - healthcare-net

  telemedicine-db:
    image: postgres:17-alpine
    container_name: telemedicine-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: telemedicine_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5438:5432"
    volumes:
      - telemedicine-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telemedicine_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - healthcare-net

  appointment-service:
    build:
      context: .
      dockerfile: ./services/appointment-service/Dockerfile
    ports:
      - "8004:8004"
    environment:
      APP_ENV: development
      PORT: "8004"
      DATABASE_URL: "postgres://user:password@appointment-db:5432/appointment_db?sslmode=disable"
      RABBITMQ_URL: "amqp://admin:password123@rabbitmq:5672/"
      JWT_SECRET: "local-dev-secret-change-this-in-production-32chars"
      DOCTOR_SERVICE_URL: "http://doctor-service:8003"
      PATIENT_SERVICE_URL: "http://patient-service:8002"
      INTERNAL_API_KEY: "dev-inter-service-appointments-patients"
    depends_on:
      appointment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      patient-service:
        condition: service_started
    networks:
      - healthcare-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    networks:
      - healthcare-net
  telemedicine-service:
    build:
      context: .
      dockerfile: ./services/telemedicine-service/Dockerfile
    container_name: telemedicine-service
    restart: unless-stopped
    ports:
      - "8009:8009"
    env_file:
      - ./services/telemedicine-service/.env
    environment:
      APP_ENV: development
      PORT: "8009"
      DATABASE_URL: "postgres://postgres:password123@telemedicine-db:5432/telemedicine_db?sslmode=disable"
      JWT_SECRET: "local-dev-secret-change-this-in-production-32chars"
      APPOINTMENT_SERVICE_URL: "http://appointment-service:8004"
      JITSI_BASE_URL: "https://meet.jit.si"
      RABBITMQ_URL: "amqp://admin:password123@rabbitmq:5672/"
    depends_on:
      telemedicine-db:
        condition: service_healthy
      auth-service:
        condition: service_started
      appointment-service:
        condition: service_started
    networks:
      - healthcare-net

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - type: bind
        source: ./nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - auth-service
      - patient-service
      - payment-service
      - doctor-service
      - ai-symptom-service
      - appointment-service
      - telemedicine-service
      - frontend
    networks:
      - healthcare-net

# ────────────────────────────────
# Named Volumes (data persists between container restarts)
# ────────────────────────────────
volumes:
  auth-db-data:
  ai-symptom-db-data:
  doctor-db-data:
  rabbitmq-data:
  patient-db-data:
  payment-db-data:
  appointment-db-data:
  file-storage-db-data:
  telemedicine-db-data:

# ────────────────────────────────
# Internal network
# Services talk to each other using container names as hostnames
# e.g. auth-service → "auth-db:5432", doctor-service → "doctor-db:5432"
# Services talk to each other using service names as hostnames
# e.g. auth-service connects to "auth-db:5432"
# ────────────────────────────────
networks:
  healthcare-net:
    driver: bridge
