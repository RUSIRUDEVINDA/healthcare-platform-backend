name: File Storage Service CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'services/file-storage-service/**'
      - 'k8s/file-storage-service/**'
      - '.github/workflows/file-storage-service.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/file-storage-service/**'
      - 'k8s/file-storage-service/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/file-storage-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install dependencies
        run: go mod tidy

      - name: Build
        run: go build -o file-storage-service ./cmd

      - name: Build Docker image
        working-directory: .
        run: docker build -f services/file-storage-service/Dockerfile -t file-storage-service:latest .
