apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-service-config
  namespace: healthcare
data:
  APP_ENV: "development"
  PORT: "8007"
  DATABASE_URL: "postgres://postgres:password123@admin-db:5432/admin_db?sslmode=disable"
  RABBITMQ_URL: "amqp://admin:password123@rabbitmq:5672/"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
  namespace: healthcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-service
  template:
    metadata:
      labels:
        app: admin-service
    spec:
      containers:
      - name: admin-service
        image: admin-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8007
        envFrom:
        - configMapRef:
            name: admin-service-config
        - secretRef:
            name: admin-service-secret
---
apiVersion: v1
kind: Service
metadata:
  name: admin-service
  namespace: healthcare
spec:
  selector:
    app: admin-service
  ports:
  - port: 8007
    targetPort: 8007

