apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemedicine-service
  namespace: healthcare
  labels:
    app: telemedicine-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: telemedicine-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: telemedicine-service
        version: v1
    spec:
      containers:
        - name: telemedicine-service
          image: DOCKERHUB_USERNAME/telemedicine-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8009
              name: http
          envFrom:
            - configMapRef:
                name: telemedicine-service-config
            - secretRef:
                name: telemedicine-service-secret
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8009
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8009
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

