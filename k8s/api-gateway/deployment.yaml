apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: healthcare
data:
  APP_ENV: "development"
  PORT: "8000"
  AUTH_SERVICE_URL: "http://auth-service:8001"
  DOCTOR_SERVICE_URL: "http://doctor-service:8003"
  AI_SYMPTOM_SERVICE_URL: "http://ai-symptom-service:8008"
  PATIENT_SERVICE_URL: "http://patient-service:8002"
  APPOINTMENT_SERVICE_URL: "http://appointment-service:8004"
  PAYMENT_SERVICE_URL: "http://payment-service:8005"
  TELEMEDICINE_SERVICE_URL: "http://telemedicine-service:8009"
  FILE_STORAGE_SERVICE_URL: "http://file-storage-service:8010"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: healthcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: healthyacr2026.azurecr.io/api-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: api-gateway-config
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: healthcare
spec:
  selector:
    app: api-gateway
  ports:
  - port: 80
    targetPort: 8000
