apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-storage-service
  namespace: healthcare
  labels:
    app: file-storage-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: file-storage-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: file-storage-service
        version: v1
    spec:
      containers:
        - name: file-storage-service
          image: DOCKERHUB_USERNAME/file-storage-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8010
              name: http
          envFrom:
            - configMapRef:
                name: file-storage-service-config
            - secretRef:
                name: file-storage-service-secret
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
